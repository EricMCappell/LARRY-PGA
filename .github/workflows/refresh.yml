name: Refresh pool data
on:
  schedule:
    # GitHub cron runs in UTC. Tournament play is roughly 11:00-02:00 UTC.
    - cron: '*/15 11-23 * * 4,5,6,0'   # Thu-Sun daytime ET
    - cron: '*/30 0-2 * * 5,6,0,1'     # evening ET (the next day in UTC)
    - cron: '0 3-10 * * *'             # hourly overnight, picks up final payouts
  workflow_dispatch:
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Diagnostic only. A plain curl with no custom headers; the Refresh step is
      # the real test, so a non-200 here warns but doesn't fail the job.
      - name: Check ESPN is reachable from this runner
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard') || true
          echo "ESPN scoreboard returned $code"
          if [ "$code" != "200" ]; then
            echo "::warning::ESPN scoreboard returned HTTP $code to a plain curl from this runner. Continuing; see the Refresh step."
          fi
      - run: npm ci
      - name: Refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ESPN_PROXY: ${{ secrets.ESPN_PROXY }}
        run: npm run refresh
